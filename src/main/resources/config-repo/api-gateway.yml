server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST
      routes:
        - id: book-inventory-service
          uri: lb://BOOK-INVENTORY-SERVICE
          predicates:
            - Path=/api/books/**
        - id: sales-order-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: customer-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/customers/**
        - id: restock-service
          uri: lb://SALES-ORDER-SERVICE
          predicates:
            - Path=/api/restock/**
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/media/**

sarasavi:
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,*"

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
