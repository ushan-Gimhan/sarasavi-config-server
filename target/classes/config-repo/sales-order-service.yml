server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sarasavi_sales}
    username: ${POSTGRES_USERNAME:my_postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

sarasavi:
  services:
    inventory:
      url: ${INVENTORY_SERVICE_URL:http://BOOK-INVENTORY-SERVICE}

logging:
  level:
    lk.sarasavi: DEBUG
    org.hibernate.SQL: INFO
